<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <a href="/" class="logo login-logo">
        <img src="https://media.discordapp.net/attachments/1361207730676695140/1376700759260794980/image-removebg-preview.png?ex=683647fe&is=6834f67e&hm=a6ebba317451da4480d3328e03f43526eba54a1dd50cc359ff8011066c5e2556&=&format=webp&quality=lossless&width=648&height=601" alt="Ghostline Logo" class="logo-img">
        <span class="logo-text">Ghostline</span>
    </a>
    <div class="login-container">
        <div class="login-box">
            <h1>Sign Up</h1>
            <form id="signup-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
                <div id="error-message" style="color: #ff4444; margin-bottom: 15px; display: none;"></div>
                <button type="submit">Sign Up</button>
            </form>
            <a href="/login.html" class="signup-btn">Login</a>
        </div>
    </div>

    <script src="signup.js"></script>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div style="color: white;">Copyright © 2025 Ghostline</div>
                <div class="footer-links">
                    <a href="#">Contact</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
